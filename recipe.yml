
name: zenith-os
description: Il punto più alto dell'esperienza Linux. Un sistema operativo immutabile e minimale.

base-image: ghcr.io/ublue-os/fedora-silverblue
image-version: 44 

modules:
  - type: files
    files:
      - usr: /usr 

  - type: rpm-ostree
    install:
      - fastfetch 
      - git
      - curl
      - tmux

  - type: default-flatpaks
    notify: true
    install:
      - org.mozilla.firefox
      
  - type: gsettings
    profile: user
    schemas:
      - schema: org.gnome.desktop.background
        keys:
          picture-uri: "'file:///usr/share/backgrounds/origami/default.jpg'"
          picture-uri-dark: "'file:///usr/share/backgrounds/origami/default.jpg'"

  # Questo script cambia il nome nel Bootloader (Menu GRUB) all'avvio del PC
  - type: script
    snippets:
      - |
        echo "Personalizzazione del Bootloader per Zenith OS..."
        sed -i 's/Fedora/'"Zenith OS"'/g' /usr/share/anaconda/boot/grub.cfg 2>/dev/null || true
